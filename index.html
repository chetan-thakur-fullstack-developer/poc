<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Executive Wealth · Personal Finance OS</title>
    <meta name="description" content="Executive-grade personal finance dashboard — portfolios, accounts, budgets, taxes and more." />
    <!-- SPA routing for GitHub Pages: redirect /?/ URLs back to real paths -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💎</text></svg>" />
    <style>
      html { background: #0B1120; }
      body { margin: 0; padding: 0; }
    </style>
    <!-- Catch any JS error and show it on-screen for debugging -->
    <script>
      window.__appErrors = [];
      window.onerror = function(msg, src, line, col, err) {
        var box = document.getElementById('root');
        if (box) {
          box.innerHTML = '<div style="color:#fb7185;padding:2rem;font-family:monospace;font-size:13px;line-height:1.6;max-width:800px;margin:0 auto"><h2 style="color:#f8fafc;font-family:sans-serif">App Error — please report this</h2><b>' + msg + '</b><br><br>' + (err && err.stack ? err.stack.replace(/</g,"&lt;") : src + ':' + line) + '</div>';
        }
        return false;
      };
      window.addEventListener('unhandledrejection', function(e) {
        var box = document.getElementById('root');
        if (box && box.children.length === 0) {
          box.innerHTML = '<div style="color:#fb7185;padding:2rem;font-family:monospace;font-size:13px;line-height:1.6;max-width:800px;margin:0 auto"><h2 style="color:#f8fafc;font-family:sans-serif">Unhandled Promise Rejection</h2><pre>' + String(e.reason).replace(/</g,"&lt;") + '</pre></div>';
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
